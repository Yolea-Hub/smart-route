name: Question
description: Une question sur l'usage de Smart Route. / A question about using Smart Route.
labels: ["question"]
body:
  - type: textarea
    id: question
    attributes:
      label: Votre question / Your question
      description: Dites ce que vous essayez de faire. / Say what you are trying to do.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version et système / Version and system
      placeholder: "0.1.0, Windows 11"
